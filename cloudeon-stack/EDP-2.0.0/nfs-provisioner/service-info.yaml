name: NFS_PROVISIONER
label: "NFS Provisioner"
# 前置要求：在集群可访问的环境中安装 NFS 服务，并在各节点安装 NFS client
description: "NFS 动态卷分配器，它可用现有的 NFS 服务器通过持久卷声明来支持动态分配 K8s 持久卷"
version: 4.0.2

dependencies:
  - HELM_CONTROLLER

supportKerberos: false

dashboard:
  uid: ""

roles:
  - name: HELM_CHART
    label: "NFS Subdir External Provisioner Helm Chart"
    roleFullName: "nfs-provisioner"
    sortNum: 1
    type: HELM_CHART
    needOdd: false
    fixedNum: 1
  - name: NFS_PROVISIONER
    label: "NFS provisioner"
    roleFullName: "nfs-provisioner"
    sortNum: 2
    type: EMPTY
    needOdd: false
    minNum: 1
    linkExpression: ""

customConfigFiles:
  - nfs-provisioner.conf

configurations: 

  - name: nfs-provisioner.namespace
    description: "nfs-subdir-external-provisioner 部署的命名空间。"
    recommendExpression: "nfs-provisioner"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: nfs-subdir-external-provisioner.helm.repo
    description: "nfs-subdir-external-provisioner 部署所用的 Helm 仓库。\n
    网络允许推荐使用：https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/\n
    内网环境：需要使用私有helm仓库，另外，内网环境下需要将镜像上传到私有镜像仓库，并在nfs-provisioner.conf添加配置项\n
      如：global.imageRegistry 。具体参考对应版本的 nfs-subdir-external-provisioner 的 values.yaml 文件
    "
    recommendExpression: "http://172.30.16.10:8117/helm-repo/nfs-subdir-external-provisioner"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: nfs-subdir-external-provisioner.helm.version
    description: "nfs-subdir-external-provisioner Helm chart 的版本号"
    recommendExpression: "4.0.18"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: image.registry.proxy.k8s
    description: "registry.k8s.io 的代理镜像地址，避免因网络问题导致镜像拉取失败。可参考https://github.com/ciiiii/cloudflare-docker-proxy"
    recommendExpression: "172.30.16.10"
    valueType: InputString
    configurableInWizard: true
    tag: "镜像"

  - name: nfs.server
    description: "NFS server 地址"
    recommendExpression: "172.30.16.10"
    valueType: InputString
    configurableInWizard: true
    tag: "nfs"

  - name: nfs.path
    description: "NFS path 地址"
    recommendExpression: "/data/nfs"
    valueType: InputString
    configurableInWizard: true
    tag: "nfs"

  - name: storage.class.default-class
    description: "设为默认存储类"
    recommendExpression: false
    valueType: Switch
    configurableInWizard: true
    tag: "nfs"
