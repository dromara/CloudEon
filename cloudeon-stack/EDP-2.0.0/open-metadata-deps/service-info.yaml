name: OPEN_METADATA_DEPS
label: "OpenMetadata Deps"
description: "OpenMetadata Helm Dependencies，包含 Airflow、OpenSearch 等"
version: 1.10.2

# 前置要求：1）至少 4G 内存的 K8s 集群；
#  2）已安装 Helm 3；
#  3）针对 MySQL and Airflow 密码 的 Kubernetes secrets 必须在部署前创建好； // 已由系统根据 k8s-render 目录下的配置自动创建
#  4）K8s 集群必须支持现有已配置的 NFS server。

dependencies:
  - NFS_PROVISIONER

supportKerberos: false

dashboard:
  uid: ""

roles:
  - name: HELM_CHART
    label: "OpenMetadata Dependencies Helm Chart"
    roleFullName: "openmetadata-dependencies" # 这个名字是固定的，因为 OpenMetadata 的 Helm Chart 里声明了后续访问 openmetadata-dependencies-web
    sortNum: 1
    type: HELM_CHART
    needOdd: false
    fixedNum: 1
  - name: AIRFLOW
    label: "Airflow"
    roleFullName: "airflow"
    sortNum: 2
    type: EMPTY
    needOdd: false
    minNum: 1
#    linkExpression: "http://${localhostname}:${conf['airflow.service.nodePort']}"
    linkExpression: ""
  - name: OPENSEARCH
    label: "OpenSearch"
    roleFullName: "opensearch"
    sortNum: 3
    type: EMPTY
    needOdd: false
    minNum: 1
    linkExpression: "http://${localhostname}:${conf['opensearch.service.nodePort']}"
  - name: MYSQL
    label: "MySQL"
    roleFullName: "mysql"
    sortNum: 4
    type: EMPTY
    needOdd: false
    minNum: 1
    linkExpression: ""

customConfigFiles:
  - open-metadata-dependencies.conf

configurations: 

  - name: open-metadata-dependencies.namespace
    description: "open-metadata-dependencies 部署的命名空间。"
    recommendExpression: "open-metadata"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: open-metadata-dependencies.helm.repo
    description: "open-metadata-dependencies 部署所用的 Helm 仓库。\n
    网络允许推荐使用：https://helm.open-metadata.org/\n
    内网环境：需要使用私有helm仓库，另外，内网环境下需要将镜像上传到私有镜像仓库，并在open-metadata-dependencies.conf添加配置项\n
      如：global.imageRegistry 。具体参考对应版本的openmetadata-dependencies的values.yaml文件
    "
    recommendExpression: "http://172.30.16.10:8117/helm-repo/openmetadata"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: open-metadata-dependencies.helm.version
    description: "open-metadata-dependencies Helm chart 的版本号"
    recommendExpression: "1.10.2"
    valueType: InputString
    configurableInWizard: true
    tag: "k8s"

  - name: image.registry.proxy.docker
    description: "docker.io 的代理镜像地址，避免因网络问题导致镜像拉取失败。可参考https://github.com/ciiiii/cloudflare-docker-proxy"
    recommendExpression: 172.30.16.10
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "镜像"

  - name: storage.class
    description: "用于持久存储的存储类"
    recommendExpression: "nfs-client"
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "storageClass"

  # 使用外部的数据库时，部署前需要手动执行 openmetadata-dependencies/values.yaml 中 mysql 部分的 initdbScripts 脚本！
  - name: airflow.external.db.host
    description: "Airflow 使用的外部数据库实例主机"
    recommendExpression: "172.30.16.10"
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "airflow"

  - name: airflow.external.db.port
    description: "Airflow 使用的外部数据库实例端口"
    recommendExpression: 3306
    valueType: InputNumber
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "airflow"

  - name: airflow.mysql.password
    description: "airflow-mysql-secrets 的 Base64 编码后的密码"
    recommendExpression: "YWlyZmxvd19wYXNz"
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "secrets"

  - name: openmetadata.airflow.password
    description: "airflow-secrets 的 Base64 编码后的密码"
    recommendExpression: "YWRtaW4="
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "secrets"

  - name: openmetadata.mysql.password
    description: "mysql-secrets 的 Base64 编码后的密码"
    recommendExpression: "b3Blbm1ldGFkYXRhX3Bhc3N3b3Jk"
    valueType: InputString
    confFile:  "open-metadata-dependencies.conf"
    configurableInWizard: true
    tag: "secrets"
